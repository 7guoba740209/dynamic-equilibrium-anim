<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小船过河 · 交互动画系统</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F2F6FA; --card:#FFFFFF; --line:#E3E9F0; --line2:#CBD6E3;
    --tx:#16202C; --tx2:#5D6D80; --tx3:#8A98A8;
    --red:#E11D48; --blue:#2563EB; --green:#16A34A; --amber:#D97706; --teal:#0F766E;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:14px/1.6 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1500px;margin:0 auto;padding:14px 16px 34px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.3px}
  .sub{margin:2px 0 0;color:var(--tx2);font-size:12.5px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:13px;cursor:pointer;color:var(--tx);
    background:var(--card);border:1px solid var(--line2);border-radius:9px;
    padding:7px 13px;transition:.16s;white-space:nowrap;
  }
  button:hover{border-color:#94A8BE;background:#F8FBFF}
  button.pri{background:#16202C;border-color:#16202C;color:#fff;font-weight:600}
  button.pri:hover{background:#28394C}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .modes button{background:#fff}
  .modes button.on{background:#16202C;border-color:#16202C;color:#fff;font-weight:600}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;align-items:start}
  .stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,70,.05)}
  #cv{display:block;width:100%}
  .hintline{margin-top:8px;color:var(--tx3);font-size:12.5px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:7px 12px}
  .legend{
    position:absolute;left:12px;top:12px;display:flex;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:9px;
    padding:6px 11px;font-size:12.5px;color:var(--tx2);backdrop-filter:blur(3px);
  }
  .legend i{display:inline-block;width:16px;height:3.5px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .badge{
    position:absolute;right:12px;top:12px;background:rgba(22,32,44,.88);color:#fff;
    border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  }
  .hintbar{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.9);border:1px solid var(--line);
    border-radius:9px;padding:4px 10px;font-size:12px;color:var(--tx3)}  .side{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .card h2{margin:0 0 9px;font-size:13px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px}
  .card h2::before{content:"";width:3px;height:13px;background:#16202C;border-radius:2px}
  .ctrl{margin-bottom:11px}
  .ctrl:last-child{margin-bottom:0}
  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--tx2);margin-bottom:3px}
  .ctrl .val{font-weight:700;color:var(--tx);font-size:13.5px;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:20px;accent-color:#16202C;cursor:pointer;margin:0}
  input[type=range]:disabled{opacity:.4;cursor:not-allowed}
  .ro{display:flex;justify-content:space-between;padding:3.5px 0;font-size:13px;border-bottom:1px dashed #EEF2F7}
  .ro:last-child{border-bottom:0}
  .ro span{color:var(--tx2)}
  .ro b{font-variant-numeric:tabular-nums;font-weight:700}
  .bname{font-size:12.5px;font-weight:700;margin:2px 0 5px;display:flex;align-items:center;gap:6px}
  .bname i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .bottom{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;margin-top:14px;align-items:start}
  .chartbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;overflow:hidden}
  #chart{display:block;width:100%}
  .notes{font-size:13px}
  .notes p{margin:0 0 8px}
  .notes p:last-child{margin-bottom:0}
  .k{background:#F1F5FA;border-radius:4px;padding:0 4px;font-family:Consolas,Monaco,monospace;font-size:12.5px}
  .warn{color:var(--red);font-weight:700}
  .ok{color:var(--green);font-weight:700}
  .em{color:var(--amber);font-weight:700}
  .foot{margin-top:16px;color:var(--tx3);font-size:12px;text-align:center}
  @media (max-width:1120px){
    .main{grid-template-columns:minmax(0,1fr)}
    .bottom{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>小船过河 · 交互动画系统</h1>
      <p class="sub">运动的合成与分解 ｜ 渡河时间极值 · 渡河位移极值 ｜ 可直接拖动小船调整船头方向</p>
    </div>
    <div class="actions">
      <button id="btnPlay" class="pri">开始</button>
      <button id="btnReset">重置</button>
      <button id="btnEnd">直达终点</button>
      <button id="btnShot">导出图片</button>
      <button id="btnFull">全屏</button>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-mode="tMin">方案一：最短时间</button>
    <button data-mode="sMin">方案二：最短位移</button>
    <button data-mode="free" class="on">自由调节船头</button>
    <button data-mode="compare">双船对比</button>
  </div>

  <div class="main">
    <div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="legend">
        <span><i style="background:#E11D48"></i>v船 船头方向</span>
        <span><i style="background:#2563EB"></i>v水 水流方向</span>
        <span><i style="background:#16A34A"></i>v合 实际航线</span>
      </div>
      <div class="badge" id="badge">自由调节船头</div>
    </div>
    <div class="hintline">拖动小船可改变船头指向 ｜ 空格 播放/暂停 ｜ 方向键 微调角度 ｜ R 重置</div>
    </div>

    <div class="side">
      <div class="card">
        <h2>参数调整</h2>
        <div class="ctrl">
          <div class="lab"><span>河宽 d</span><span class="val"><b id="vd">120</b> m</span></div>
          <input type="range" id="sd" min="60" max="240" step="5" value="120">
        </div>
        <div class="ctrl">
          <div class="lab"><span>水速 v水</span><span class="val"><b id="vwv">3.0</b> m/s</span></div>
          <input type="range" id="sw" min="0" max="6" step="0.1" value="3">
        </div>
        <div class="ctrl">
          <div class="lab"><span>船速 v船（静水中）</span><span class="val"><b id="vbv">4.0</b> m/s</span></div>
          <input type="range" id="sb" min="0.5" max="6" step="0.1" value="4">
        </div>
        <div class="ctrl">
          <div class="lab"><span>船头角 θ（与上游河岸）</span><span class="val"><b id="vt">90</b> °</span></div>
          <input type="range" id="st" min="3" max="177" step="1" value="90">
        </div>
        <div class="ctrl">
          <div class="lab"><span>时间倍率</span><span class="val"><b id="vr">2.0</b> ×</span></div>
          <input type="range" id="sr" min="0.5" max="8" step="0.5" value="2">
        </div>
        <div class="ctrl">
          <div class="lab"><span>矢量比例（箭头长度）</span><span class="val"><b id="vv">1.2</b> ×</span></div>
          <input type="range" id="sv" min="0.6" max="2" step="0.1" value="1.2">
        </div>
      </div>

      <div class="card">
        <h2>实时数据</h2>
        <div id="readout"></div>
      </div>

      <div class="card">
        <h2>理论极值</h2>
        <div id="theory"></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <div class="card notes" id="notes"></div>
  </div>

  <p class="foot">高中物理 · 运动的合成与分解 ｜ 小船过河模型交互动画</p>
</div>

<script>
(function(){
'use strict';

var $  = function(s){return document.querySelector(s);};
var clamp = function(v,a,b){return v<a?a:(v>b?b:v);};
var nf = function(v,n){ n = (n===undefined?1:n); return isFinite(v)?v.toFixed(n):'∞'; };
var FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif';
var fnt = function(w,s){ return w+' '+s+'px '+FONT; };

/* ================= 参数 ================= */
var P = { d:120, vw:3.0, vb:4.0, theta:90, rate:2, vec:1.2, mode:'free' };
var SIM = { t:0, running:false, stuck:false };
var boats = [];

/* ================= 物理内核 =================
   坐标：x 沿河（下游为正），y 垂直河岸（对岸为正）
   v船 = ( -v船·cosθ , v船·sinθ )   θ 为船头与上游河岸的夹角
   v水 = (  v水 , 0 )
   v合 = v船 + v水
   t渡 = d / v合y ，沿河漂移 x = v合x · t渡 ，位移 S = √(d² + x²)
============================================= */
function derive(thetaDeg, vb, vw, d){
  var th = clamp(thetaDeg,0.5,179.5)*Math.PI/180;
  var bx = -vb*Math.cos(th), by = vb*Math.sin(th);
  var rx = bx + vw, ry = by;
  var vR = Math.hypot(rx,ry);
  var tCross = ry > 1e-3 ? d/ry : Infinity;
  var drift  = isFinite(tCross) ? rx*tCross : Infinity;
  var S      = isFinite(drift) ? Math.hypot(d, drift) : Infinity;
  return { th:th, bx:bx, by:by, rx:rx, ry:ry, vR:vR, tCross:tCross, drift:drift, S:S };
}

function optTheta(vb,vw){                       // 位移最小的船头角
  if(vb<=0||vw<=0) return 90;
  var r = Math.min(vb,vw)/Math.max(vb,vw);
  return Math.acos(clamp(r,0,1))*180/Math.PI;
}
function isCritical(){ return Math.abs(P.vb-P.vw) < 0.06; }
function canCross(){ return P.vb > P.vw + 1e-6; }

/* ================= 场景 ================= */
function mkBoat(name,theta,color,canopy){
  return { name:name, theta:theta, color:color, canopy:canopy,
           dr:derive(theta,P.vb,P.vw,P.d), t:0, x:0, y:0, landed:false };
}
function buildScene(){
  var wasRunning = SIM.running;
  var list = [];
  if(P.mode==='compare'){
    list.push(mkBoat('① 最短时间', 90, '#E11D48', '#F6E3C5'));
    list.push(mkBoat('② 最短位移', optTheta(P.vb,P.vw), '#0F766E', '#CFE9E4'));
  }else{
    var t = P.theta;
    if(P.mode==='tMin') t = 90;
    if(P.mode==='sMin') t = optTheta(P.vb,P.vw);
    if(P.mode==='tMin'||P.mode==='sMin'){ P.theta = clamp(Math.round(t),3,177); syncThetaUI(); }
    list.push(mkBoat('小船', t, '#E11D48', '#F6E3C5'));
  }
  boats = list;
  resetSim();
  if(wasRunning){ SIM.running = true; setPlayLabel(); }   /* 改参数后保持播放状态 */
}
function resetSim(){
  for(var i=0;i<boats.length;i++){ boats[i].t=0; boats[i].x=0; boats[i].y=0; boats[i].landed=false; }
  SIM.t=0; SIM.running=false; SIM.stuck=false;
  setPlayLabel();
}

/* ================= 画布 ================= */
var cv=$('#cv'), ctx=cv.getContext('2d');
var ch=$('#chart'), cx=ch.getContext('2d');
var W=1180,H=600,CW=1180,CH=250,DPR=1;

function fit(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  var r = cv.parentElement.getBoundingClientRect();
  W = Math.max(660, Math.round(r.width));
  H = Math.round(clamp(W*0.505, 430, 620));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  var r2 = ch.parentElement.getBoundingClientRect();
  CW = Math.max(600, Math.round(r2.width-12));
  CH = Math.round(clamp(CW*0.215, 190, 260));
  ch.width = Math.round(CW*DPR); ch.height = Math.round(CH*DPR);
  ch.style.height = CH+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
}

/* ================= 视图映射 ================= */
var view = { k:4, pad:60, cy:300, xLo:-40, xHi:200 };
function SX(x){ return view.pad + (x-view.xLo)*view.k; }
function SY(y){ return view.cy + (P.d/2 - y)*view.k; }

function computeView(){
  var kRiver = (H-118)/P.d;
  var dS = derive(optTheta(P.vb,P.vw),P.vb,P.vw,P.d);
  var dT = derive(90,P.vb,P.vw,P.d);
  var refX = Math.max(0.35*P.d, Math.abs(dS.drift), Math.abs(dT.drift));
  var xLo = -0.30*refX, xHi = 1.24*refX, span = xHi-xLo;
  var kH = (W-120)/span;
  var k = Math.min(kRiver,kH);
  view.k = k; view.cy = H/2 + 6;
  view.xLo = xLo; view.xHi = xHi;
  var used = span*k;
  view.pad = Math.max(60, (W-used)/2);   /* 内容水平居中 */
}

/* ================= 水面 & 岸 ================= */
var streaks = [];
function initStreaks(){
  streaks = [];
  for(var i=0;i<34;i++){
    streaks.push({ x:Math.random()*W, y:Math.random(), len:10+Math.random()*34, a:.16+Math.random()*.26 });
  }
}
var wavePhase = 0;

function drawBackground(){
  ctx.fillStyle='#FBFDFF'; ctx.fillRect(0,0,W,H);
  var top = SY(P.d), bot = SY(0);
  /* 岸上陆地 */
  ctx.fillStyle='#F7F4EC'; ctx.fillRect(0,0,W,Math.max(0,top));
  ctx.fillStyle='#F7F4EC'; ctx.fillRect(0,bot,W,Math.max(0,H-bot));
  /* 岸边草带 */
  ctx.fillStyle='#BFD9A6'; ctx.fillRect(0,top-4,W,4);
  ctx.fillStyle='#BFD9A6'; ctx.fillRect(0,bot,W,4);
  ctx.strokeStyle='#B9B3A2'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,top+.5); ctx.lineTo(W,top+.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,bot+.5); ctx.lineTo(W,bot+.5); ctx.stroke();
  /* 河水 */
  ctx.fillStyle='#E4F4FD'; ctx.fillRect(0,top,W,Math.max(0,bot-top));
}

function drawWater(){
  var top = SY(P.d), bot = SY(0), hh = bot-top;
  if(hh<=0) return;
  /* 波纹 */
  var rows = 13;
  for(var i=0;i<rows;i++){
    var y = top + (i+0.5)*(hh/rows);
    ctx.beginPath();
    for(var x=0;x<=W;x+=10){
      var yy = y + Math.sin(x*0.013 + wavePhase + i*0.75)*2.1;
      if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.strokeStyle='rgba(96,178,232,.30)'; ctx.lineWidth=1; ctx.stroke();
  }
  /* 水流流线 */
  for(var s=0;s<streaks.length;s++){
    var st = streaks[s];
    if(st.x > W+40) st.x = -40;
    var sy = top + st.y*hh;
    ctx.beginPath(); ctx.moveTo(st.x,sy); ctx.lineTo(st.x+Math.min(26,st.len*(0.5+P.vw/6)),sy);
    ctx.strokeStyle='rgba(56,150,220,'+st.a.toFixed(2)+')';
    ctx.lineWidth=2; ctx.lineCap='round'; ctx.stroke();
  }
  /* 水流方向示意 */
  var ay = top+hh*0.20;
  ctx.save();
  ctx.strokeStyle='rgba(37,99,235,.55)'; ctx.lineWidth=1.6; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(W-210,ay); ctx.lineTo(W-96,ay); ctx.stroke();
  ctx.restore();
  arrow(W-210,ay,W-86,ay,'rgba(37,99,235,.85)',2,9);
  haloText('水流方向', W-148, ay-16, 'rgba(37,99,235,.95)', 12.5, 'center', 600);
}

/* ================= 绘图基元 ================= */
function arrow(x1,y1,x2,y2,color,w,head){
  w = w||2.4; head = head||11;
  var a = Math.atan2(y2-y1,x2-x1);
  var bx = x2-Math.cos(a)*head*0.85, by = y2-Math.sin(a)*head*0.85;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=w+3.4;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.save(); ctx.translate(x2,y2); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-head,-head*0.44); ctx.lineTo(-head,head*0.44); ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.8; ctx.stroke();
  ctx.restore();
}
function haloText(txt,x,y,color,size,align,weight){
  size=size||13; align=align||'left'; weight=weight||600;
  ctx.font = fnt(weight,size); ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=4.2; ctx.strokeStyle='rgba(255,255,255,.92)';
  ctx.strokeText(txt,x,y); ctx.fillStyle=color; ctx.fillText(txt,x,y);
}
function vText(base,sub,x,y,color,size){
  size=size||15;
  var F1=fnt(700,size), F2=fnt(700,Math.round(size*0.72));
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.font=F1; var w1=ctx.measureText(base).width;
  ctx.font=F2; var w2=ctx.measureText(sub).width;
  var x0 = x-(w1+w2)/2;
  ctx.font=F1; ctx.lineJoin='round'; ctx.lineWidth=4.2; ctx.strokeStyle='rgba(255,255,255,.92)';
  ctx.strokeText(base,x0,y); ctx.fillStyle=color; ctx.fillText(base,x0,y);
  ctx.font=F2; ctx.strokeText(sub,x0+w1+1,y+size*0.24); ctx.fillText(sub,x0+w1+1,y+size*0.24);
}
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function chip(txt,x,y,bg,fg){
  ctx.font=fnt(700,12); ctx.textAlign='center'; ctx.textBaseline='middle';
  var w=ctx.measureText(txt).width+16, h=20;
  rr(ctx,x-w/2,y-h/2,w,h,6); ctx.fillStyle=bg; ctx.fill();
  ctx.fillStyle=fg; ctx.fillText(txt,x,y+.5);
}
function cchip(txt,x,y,bg,fg,size){
  size=size||12;
  cx.font=fnt(700,size); cx.textAlign='center'; cx.textBaseline='middle';
  var w=cx.measureText(txt).width+13, h=size+9;
  rr(cx,x-w/2,y-h/2,w,h,5); cx.fillStyle=bg; cx.fill();
  cx.fillStyle=fg; cx.fillText(txt,x,y+.5);
}

/* ================= 小船 ================= */
function drawBoatShape(x,y,ang,len,canopy){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  var L=len, Wd=len*0.40;
  /* 尾流 */
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-L*0.52,-Wd*0.30); ctx.lineTo(-L*0.98,-Wd*0.66); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-L*0.52, Wd*0.30); ctx.lineTo(-L*0.98, Wd*0.66); ctx.stroke();
  /* 船体 */
  ctx.beginPath();
  ctx.moveTo(L*0.56,0);
  ctx.quadraticCurveTo(L*0.34,-Wd*0.64,-L*0.14,-Wd*0.58);
  ctx.lineTo(-L*0.44,-Wd*0.46);
  ctx.quadraticCurveTo(-L*0.58,0,-L*0.44,Wd*0.46);
  ctx.lineTo(-L*0.14,Wd*0.58);
  ctx.quadraticCurveTo(L*0.34,Wd*0.64,L*0.56,0);
  ctx.closePath();
  ctx.fillStyle='#B4693A'; ctx.fill();
  ctx.strokeStyle='rgba(70,40,18,.6)'; ctx.lineWidth=1.4; ctx.stroke();
  /* 甲板线 */
  ctx.beginPath(); ctx.moveTo(-L*0.46,Wd*0.16); ctx.lineTo(L*0.42,Wd*0.16);
  ctx.strokeStyle='rgba(255,235,205,.55)'; ctx.lineWidth=1.6; ctx.stroke();
  /* 遮阳篷 */
  ctx.beginPath();
  ctx.moveTo(-L*0.30,-Wd*0.18);
  ctx.quadraticCurveTo(-L*0.06,-Wd*1.02,L*0.22,-Wd*0.18);
  ctx.closePath();
  ctx.fillStyle=canopy; ctx.fill();
  ctx.strokeStyle='rgba(70,40,18,.45)'; ctx.lineWidth=1.1; ctx.stroke();
  /* 船夫与竹篙 */
  ctx.beginPath(); ctx.arc(-L*0.36,-Wd*0.42,Math.max(2.2,len*0.055),0,Math.PI*2);
  ctx.fillStyle='#33302B'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(L*0.30,Wd*0.92); ctx.lineTo(-L*0.05,-Wd*0.98);
  ctx.strokeStyle='#8A6E4B'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
}

/* ================= 参考线 / 标尺 ================= */
function drawGuides(){
  var ax=SX(0), ay=SY(0), bx=SX(0), by=SY(P.d);
  ctx.save(); ctx.setLineDash([5,6]);
  ctx.strokeStyle='rgba(120,138,158,.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  ctx.restore();
  /* 起点 A */
  ctx.beginPath(); ctx.arc(ax,ay,4,0,Math.PI*2); ctx.fillStyle='#16202C'; ctx.fill();
  haloText('起点 A', ax, ay+20, '#3C4B5C', 12.5, 'center', 600);
  /* 正对岸 B */
  ctx.beginPath(); ctx.arc(bx,by,4,0,Math.PI*2); ctx.fillStyle='#16202C'; ctx.fill();
  haloText('正对岸 B', bx, by-18, '#3C4B5C', 12.5, 'center', 600);
}
function drawRuler(){
  var x=26, y0=SY(0), y1=SY(P.d);
  ctx.save();
  ctx.strokeStyle='rgba(120,138,158,.75)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
  var step = P.d<=120?20:(P.d<=180?30:40);
  for(var m=0;m<=P.d+0.1;m+=step){
    var yy=SY(m);
    ctx.beginPath(); ctx.moveTo(x-5,yy); ctx.lineTo(x+5,yy); ctx.stroke();
  }
  ctx.restore();
  haloText('河宽 d = '+P.d+' m', x+11, (y0+y1)/2, '#5D6D80', 12.5, 'left', 600);
}
function drawDriftDim(){
  var d = boats.length?boats[0].dr:null;
  if(!d || !isFinite(d.drift)) return;
  var drift = d.drift;
  if(Math.abs(drift)<1) return;
  var y = SY(0)+18;
  var x0=SX(0), x1=SX(drift);
  arrow(x0,y,x1,y,'#5D6D80',1.6,9);
  ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(120,138,158,.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(SX(0),SY(0)); ctx.lineTo(SX(0),y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1,SY(0)); ctx.lineTo(x1,y+6); ctx.stroke();
  ctx.restore();
  haloText('沿河漂移 x = '+nf(drift,1)+' m',(x0+x1)/2, y+17, '#3C4B5C', 12.5, 'center', 700);
}

/* ================= 速度矢量与航线 ================= */
var KVEC = 28;   /* px per (m/s)：三个矢量共用同一比例，长度严格随大小成比例 */
function kv(){ return KVEC*P.vec; }
/* θ 圆弧单独绘制，保证几何正确 */
function drawTheta(b){
  var phx=SX(b.x), phy=SY(b.y), d=b.dr;
  var R = clamp(Math.max(clamp(0.085*P.d*view.k,34,66)*1.45, P.vb*kv()*0.52), 54, 108);
  var a0 = Math.PI;                                  /* 上游河岸方向（屏幕向左） */
  var a1 = Math.atan2(-d.by,-d.bx);                  /* 船头方向 */
  var end = a1, delta = a1 - a0;
  while(delta < 0) delta += Math.PI*2;
  if(delta > Math.PI*2) delta = Math.PI*2;
  ctx.beginPath();
  ctx.arc(phx,phy,R,a0,a0+delta,false);
  ctx.strokeStyle='rgba(217,119,6,.9)'; ctx.lineWidth=1.6; ctx.stroke();
  var mid=a0+delta/2;
  haloText('θ='+nf(b.theta,0)+'°', phx+Math.cos(mid)*(R+2), phy+Math.sin(mid)*(R+2)+4, '#B45309', 12.5, 'center', 700);
}

/* ================= 主绘制 ================= */
function draw(){
  computeView();
  drawBackground();
  drawWater();
  drawRuler();
  drawGuides();
  for(var i=0;i<boats.length;i++){
    var b=boats[i], d=b.dr;
    if(d.ry>1e-3 && isFinite(d.tCross)){
      ctx.save(); ctx.setLineDash([7,7]); ctx.strokeStyle='rgba(22,163,74,.40)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(SX(0),SY(0)); ctx.lineTo(SX(d.drift),SY(P.d)); ctx.stroke(); ctx.restore();
      /* 落点标记 */
      var lx=SX(d.drift), ly=SY(P.d);
      if(lx>-60 && lx<W+60){
        ctx.beginPath(); ctx.arc(lx,ly,5.5,0,Math.PI*2);
        ctx.fillStyle='#FFFFFF'; ctx.fill();
        ctx.strokeStyle='rgba(22,163,74,.95)'; ctx.lineWidth=2.2; ctx.stroke();
        if(Math.abs(d.drift)>3) chip('落点', clamp(lx,64,W-64), ly+17, 'rgba(255,255,255,.94)', '#15803D');
      }
    }
    if(b.x!==0 || b.y!==0){
      ctx.save(); ctx.strokeStyle='rgba(22,163,74,.95)'; ctx.lineWidth=2.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(SX(0),SY(0)); ctx.lineTo(SX(b.x),SY(b.y)); ctx.stroke(); ctx.restore();
    }
  }
  for(var j=0;j<boats.length;j++){
    var bb=boats[j], dd=bb.dr;
    var phx=SX(bb.x), phy=SY(bb.y);
    var ang=Math.atan2(-dd.by, dd.bx);
    var len=clamp(0.085*P.d*view.k, 34, 66);
    drawBoatShape(phx,phy,ang,len,bb.canopy);
  }
  for(var k2=0;k2<boats.length;k2++) drawVectors(boats[k2]);
  for(var k3=0;k3<boats.length;k3++) drawTheta(boats[k3]);
  drawDriftDim();
}

function drawVectors(b){
  var phx=SX(b.x), phy=SY(b.y), d=b.dr;
  var tipB=[phx+d.bx*kv(), phy-d.by*kv()];
  var tipW=[phx+P.vw*kv(), phy];
  var tipR=[phx+d.rx*kv(), phy-d.ry*kv()];
  ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(120,138,158,.7)'; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(tipB[0],tipB[1]); ctx.lineTo(tipR[0],tipR[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tipW[0],tipW[1]); ctx.lineTo(tipR[0],tipR[1]); ctx.stroke();
  ctx.restore();
  if(P.vw>0.02) arrow(phx,phy,tipW[0],tipW[1],'#2563EB',2.6);
  arrow(phx,phy,tipB[0],tipB[1],'#E11D48',2.6);
  if(d.vR>0.02) arrow(phx,phy,tipR[0],tipR[1],'#16A34A',2.9);
  var u=Math.hypot(tipB[0]-phx,tipB[1]-phy)||1;
  vText('v','船', clamp(tipB[0]+(tipB[0]-phx)/u*20, 34, W-34), clamp(tipB[1]+(tipB[1]-phy)/u*20+6, 22, H-22), '#C4143F', 15);
  if(P.vw>0.02) vText('v','水', clamp(tipW[0]+17, 34, W-34), clamp(tipW[1]-7, 22, H-22), '#1D4ED8', 15);
  if(d.vR>0.02){
    var u2=Math.hypot(tipR[0]-phx,tipR[1]-phy)||1;
    vText('v','合', clamp(tipR[0]+(tipR[0]-phx)/u2*23, 34, W-34), clamp(tipR[1]+(tipR[1]-phy)/u2*23+6, 22, H-22), '#15803D', 15);
  }
  var off = boats.length>1 ? (b.name.indexOf('①')===0?-30:30) : -32;
  chip(b.name, phx, phy+off, 'rgba(255,255,255,.94)', b.color);
}

/* ================= 仿真 ================= */
function step(dtReal){
  var dt = dtReal*P.rate;
  var moving=false;
  for(var i=0;i<boats.length;i++){
    var b=boats[i];
    if(b.landed) continue;
    moving=true;
    b.t += dt;
    var d=b.dr;
    if(isFinite(d.tCross)){
      if(b.t>=d.tCross){ b.t=d.tCross; b.landed=true; }
    }else{
      var lim = 6*P.d/Math.max(P.vb,0.2);
      if(b.t>lim){ b.t=lim; SIM.running=false; SIM.stuck=true; }
    }
    b.x = d.rx*b.t; b.y = d.ry*b.t;
  }
  SIM.t = boats.length?Math.max.apply(null,boats.map(function(o){return o.t;})):0;
  if(!moving){ SIM.running=false; setPlayLabel(); }
  return moving;
}

/* ================= 主循环 ================= */
var last=0, uiAcc=1;
function loop(ts){
  if(!last) last=ts;
  var dt=Math.min(0.06,Math.max(0,(ts-last)/1000)); last=ts;
  if(SIM.running) step(dt);
  wavePhase += dt*(0.9+P.vw*0.55);
  for(var s=0;s<streaks.length;s++){
    streaks[s].x += P.vw*view.k*0.55*dt;
    if(streaks[s].x > W+40) streaks[s].x = -40;
  }
  draw();
  uiAcc += dt;
  if(uiAcc>0.1){ uiAcc=0; updateReadout(); drawChart(); }
  requestAnimationFrame(loop);
}

/* ================= 数据面板 ================= */
function ro(label,val,color){
  return '<div class="ro"><span>'+label+'</span><b'+(color?' style="color:'+color+'"':'')+'>'+val+'</b></div>';
}
function updateReadout(){
  var html='';
  for(var i=0;i<boats.length;i++){
    var b=boats[i], d=b.dr, rem=Math.max(0,P.d-b.y);
    if(boats.length>1) html += '<div class="bname"><i style="background:'+b.color+'"></i>'+b.name+'（θ='+nf(b.theta,0)+'°）</div>';
    html += ro('已用时间 t', nf(b.t,1)+' s');
    html += ro('距对岸距离', nf(rem,1)+' m');
    html += ro('沿河漂移 x', (isFinite(d.drift)?nf(d.drift,1):'∞')+' m');
    html += ro('总位移 S', (isFinite(d.S)?nf(d.S,1):'∞')+' m');
    html += ro('合速度 v合', nf(d.vR,2)+' m/s');
    html += ro('状态', b.landed?'<span class="ok">已到达对岸</span>':(SIM.stuck?'<span class="warn">无法渡河</span>':'航行中'));
    if(boats.length>1 && i===0) html += '<div style="height:8px"></div>';
  }
  $('#readout').innerHTML = html;
}

function updateTheory(){
  var dS=derive(optTheta(P.vb,P.vw),P.vb,P.vw,P.d), dT=derive(90,P.vb,P.vw,P.d);
  var h='';
  h += ro('最短时间 t最小', 'd / v船 = '+nf(dT.tCross,1)+' s');
  h += ro('最短时间漂移', nf(dT.drift,1)+' m（偏下游）');
  if(isCritical()){
    h += ro('临界判定', '<span class="warn">v船 = v水</span>');
  }else{
    h += ro('最优船头角 θ', nf(optTheta(P.vb,P.vw),1)+' °');
    h += ro('最短位移 S最小', nf(dS.S,1)+' m');
    h += ro('最短位移耗时', nf(dS.tCross,1)+' s');
  }
  $('#theory').innerHTML=h;
}

function updateNotes(){
  var dS=derive(optTheta(P.vb,P.vw),P.vb,P.vw,P.d), dT=derive(90,P.vb,P.vw,P.d);
  var th_opt=optTheta(P.vb,P.vw);
  var h='';
  if(isCritical()){
    h+='<p><b>临界状态</b>：v船 = v水 = '+nf(P.vb,1)+' m/s。船头正指上游时两速度等大反向，合速度为零——<span class="warn">永远到不了对岸</span>。此时船头垂直河岸渡河时间最短，但仍会被冲到下游 '+nf(dT.drift,1)+' m。</p>';
    h+='<p>理论上漂移可趋近于零，代价是渡河时间趋于无穷，这是一道很好的极限讨论题。</p>';
  }else if(canCross()){
    h+='<p><b>船速占优</b>：v船 = '+nf(P.vb,1)+' m/s &gt; v水 = '+nf(P.vw,1)+' m/s，小船<span class="ok">可以正对岸抵达</span>（位移最短）。</p>';
    h+='<p>令 <span class="k">cosθ = v水 / v船 = '+nf(P.vw/P.vb,3)+'</span>，得 θ = <b>'+nf(th_opt,1)+'°</b>，此时合速度垂直河岸，<span class="k">S最小 = d = '+P.d+' m</span>，耗时 <span class="k">t = d / √(v船²−v水²) = '+nf(dS.tCross,1)+' s</span>。</p>';
    h+='<p>若要<b>时间最短</b>，则船头垂直河岸，<span class="k">t最小 = d / v船 = '+nf(dT.tCross,1)+' s</span>，但落点被冲到下游 <span class="em">'+nf(dT.drift,1)+' m</span> 处——两个"最"不能兼得。</p>';
  }else{
    h+='<p><b>水速占优</b>：v船 = '+nf(P.vb,1)+' m/s &lt; v水 = '+nf(P.vw,1)+' m/s，合速度不可能垂直河岸，小船<span class="warn">无法正对岸抵达</span>。</p>';
    h+='<p>最优策略是让漂移最小：令 <span class="k">cosθ = v船 / v水 = '+nf(P.vb/P.vw,3)+'</span>，得 θ = <b>'+nf(th_opt,1)+'°</b>，此时 v船 ⊥ v合，最短位移 <span class="k">S最小 = (v水 / v船)·d = '+nf(dS.S,1)+' m</span>，沿河漂移 '+nf(Math.abs(dS.drift),1)+' m，耗时 '+nf(dS.tCross,1)+' s。</p>';
    h+='<p>注意 t最小 = d / v船 = '+nf(dT.tCross,1)+' s 仍然成立，但它与最小位移方案是<b>两条不同的航线</b>。</p>';
  }
  h+='<p style="color:#8A98A8">提示：拖动小船或拉动 θ 滑块，下方曲线会同步显示沿河漂移随船头角的变化，最低点即位移最小方案。</p>';
  $('#notes').innerHTML=h;
}

/* ================= 分析曲线 x(θ) ================= */
function drawChart(){
  var w=CW,h=CH;
  cx.clearRect(0,0,w,h);
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,w,h);
  var pad={l:62,r:18,t:48,b:32};
  var th0=3, th1=177;
  var dS=derive(optTheta(P.vb,P.vw),P.vb,P.vw,P.d);
  var dT=derive(90,P.vb,P.vw,P.d);
  var ymax = 1.45*Math.max(0.30*P.d, Math.abs(dT.drift), Math.abs(dS.drift));
  function X(th){ return pad.l + (th-th0)/(th1-th0)*(w-pad.l-pad.r); }
  function Y(v){ return pad.t + (ymax-v)/(2*ymax)*(h-pad.t-pad.b); }
  /* 网格 */
  cx.strokeStyle='#EEF2F7'; cx.lineWidth=1;
  for(var t=0;t<=180;t+=30){
    if(t<th0||t>th1) continue;
    cx.beginPath(); cx.moveTo(X(t),pad.t); cx.lineTo(X(t),h-pad.b); cx.stroke();
  }
  for(var g=-1;g<=1;g+=0.5){
    var v=g*ymax;
    cx.beginPath(); cx.moveTo(pad.l,Y(v)); cx.lineTo(w-pad.r,Y(v)); cx.stroke();
  }
  /* 零漂移线 */
  cx.strokeStyle='#CBD6E3'; cx.lineWidth=1.4;
  cx.beginPath(); cx.moveTo(pad.l,Y(0)); cx.lineTo(w-pad.r,Y(0)); cx.stroke();
  /* x(θ) 曲线 */
  cx.beginPath(); var started=false;
  for(var th=th0;th<=th1;th+=0.5){
    var v2 = derive(th,P.vb,P.vw,P.d).drift;
    if(!isFinite(v2)) continue;
    var vc = clamp(v2,-ymax*1.02,ymax*1.02);
    var px=X(th), py=Y(vc);
    if(!started){ cx.moveTo(px,py); started=true; } else cx.lineTo(px,py);
  }
  cx.strokeStyle='#D97706'; cx.lineWidth=2.4; cx.lineJoin='round'; cx.stroke();
  /* θ=90° 参考线 */
  cx.save(); cx.setLineDash([5,5]); cx.strokeStyle='rgba(37,99,235,.75)'; cx.lineWidth=1.4;
  cx.beginPath(); cx.moveTo(X(90),pad.t); cx.lineTo(X(90),h-pad.b); cx.stroke(); cx.restore();
  /* 最优角 */
  var to=optTheta(P.vb,P.vw);
  if(!isCritical() && to>th0 && to<th1){
    var yo=Y(clamp(dS.drift,-ymax*1.02,ymax*1.02));
    var ly2 = (yo-19 < pad.t+8) ? yo+20 : yo-19;
    cchip('位移最小 '+nf(to,1)+'°', clamp(X(to),78,w-72), ly2, 'rgba(255,255,255,.95)', '#15803D', 12);
    cx.beginPath(); cx.arc(X(to),yo,5,0,Math.PI*2); cx.fillStyle='#16A34A'; cx.fill();
    cx.strokeStyle='#fff'; cx.lineWidth=2; cx.stroke();
  }
  /* 当前船头角 */
  var tc = boats.length?boats[0].theta:90;
  var cxp=X(clamp(tc,th0,th1));
  cx.save(); cx.strokeStyle='rgba(225,29,72,.85)'; cx.lineWidth=1.8;
  cx.beginPath(); cx.moveTo(cxp,pad.t-4); cx.lineTo(cxp,h-pad.b); cx.stroke(); cx.restore();
  cchip('当前 θ='+nf(tc,0)+'°', clamp(cxp,74,w-68), pad.t-13, 'rgba(255,255,255,.95)', '#C4143F', 12);
  /* 轴标注 */
  cx.fillStyle='#5D6D80'; cx.font=fnt(600,12); cx.textBaseline='alphabetic';
  for(var t2=0;t2<=180;t2+=45){
    if(t2<th0||t2>th1) continue;
    cx.fillText(t2+'°', X(t2), h-pad.b+18);
  }
  cx.textAlign='right';
  cx.fillText('+'+nf(ymax,0), pad.l-8, Y(ymax)+4);
  cx.fillText('0', pad.l-8, Y(0)+4);
  cx.fillText('-'+nf(ymax,0), pad.l-8, Y(-ymax)+4);
  cx.textAlign='left';
  cx.fillStyle='#16202C'; cx.font=fnt(700,13);
  cx.fillText('沿河漂移 x 随船头角 θ 的变化（x 为负表示向上游漂）', pad.l, 16);
}

/* ================= 交互 ================= */
function setPlayLabel(){ $('#btnPlay').textContent = SIM.running?'暂停':'开始'; }

function bind(){
  $('#btnPlay').onclick=function(){
    if(SIM.stuck) resetSim();
    var allDone = boats.every(function(b){return b.landed;});
    if(allDone) resetSim();
    SIM.running=!SIM.running; setPlayLabel();
  };
  $('#btnReset').onclick=function(){ resetSim(); setPlayLabel(); };
  $('#btnEnd').onclick=function(){
    SIM.running=false; setPlayLabel();
    for(var i=0;i<boats.length;i++){
      var b=boats[i], d=b.dr;
      if(isFinite(d.tCross)){ b.t=d.tCross; b.landed=true; }
      else { b.t=6*P.d/Math.max(P.vb,0.2); SIM.stuck=true; }
      b.x=d.rx*b.t; b.y=d.ry*b.t;
    }
  };
  $('#btnShot').onclick=function(){
    var a=document.createElement('a');
    a.download='小船过河_'+(P.mode)+'_d'+P.d+'_v水'+nf(P.vw,1)+'_v船'+nf(P.vb,1)+'_θ'+nf(P.theta,0)+'.png';
    a.href=cv.toDataURL('image/png'); a.click();
  };
  $('#btnFull').onclick=function(){
    var el=document.querySelector('.wrap');
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
    else document.exitFullscreen();
  };

  $('#modes').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    P.mode=b.dataset.mode;
    Array.prototype.forEach.call(this.querySelectorAll('button'),function(o){ o.classList.toggle('on',o===b); });
    var titles={tMin:'方案一 · 最短时间',sMin:'方案二 · 最短位移',free:'自由调节船头',compare:'双船对比'};
    $('#badge').textContent=titles[P.mode];
    var dis = P.mode!=='free';
    $('#st').disabled=dis; $('#vt').style.opacity=dis?.45:1;
    buildScene(); updateTheory(); updateNotes(); fit();
  });

  function bindRange(id,valId,key,fix,after){
    $(id).addEventListener('input',function(){
      P[key]=parseFloat(this.value);
      $(valId).textContent=fix(P[key]);
      if(after) after();
    });
  }
  bindRange('#sd','#vd','d',function(v){return v;},function(){ buildScene(); updateTheory(); updateNotes(); });
  bindRange('#sw','#vwv','vw',function(v){return nf(v,1);},function(){ buildScene(); updateTheory(); updateNotes(); });
  bindRange('#sb','#vbv','vb',function(v){return nf(v,1);},function(){
    if(P.mode==='sMin'){ P.theta=clamp(Math.round(optTheta(P.vb,P.vw)),3,177); syncThetaUI(); }
    buildScene(); updateTheory(); updateNotes();
  });
  bindRange('#sr','#vr','rate',function(v){return nf(v,1);});
  bindRange('#sv','#vv','vec',function(v){return nf(v,1);});
  $('#st').addEventListener('input',function(){
    P.theta=parseFloat(this.value); $('#vt').textContent=P.theta;
    P.mode='free';
    var mbar=$('#modes'); Array.prototype.forEach.call(mbar.querySelectorAll('button'),function(o){ o.classList.toggle('on',o.dataset.mode==='free'); });
    $('#badge').textContent='自由调节船头';
    buildScene(); updateNotes();
  });

  window.addEventListener('keydown',function(e){
    if(e.key===' '){ e.preventDefault(); $('#btnPlay').click(); }
    if(e.key==='r'||e.key==='R'){ resetSim(); }
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      if(P.mode!=='free') return;
      P.theta=clamp(P.theta+(e.key==='ArrowRight'?1:-1),3,177);
      syncThetaUI(); buildScene(); updateNotes();
    }
  });

  /* 拖动小船改变船头方向 */
  var drag=false;
  function toLocal(ev){
    var r=cv.getBoundingClientRect();
    return { x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height) };
  }
  cv.addEventListener('pointerdown',function(ev){
    var p=toLocal(ev), b=boats[0];
    var dxx=p.x-SX(b.x), dyy=p.y-SY(b.y);
    if(Math.hypot(dxx,dyy)<95){ drag=true; cv.setPointerCapture(ev.pointerId); cv.style.cursor='grabbing'; P.mode='free';
      var mbar=$('#modes'); Array.prototype.forEach.call(mbar.querySelectorAll('button'),function(o){ o.classList.toggle('on',o.dataset.mode==='free'); });
      $('#badge').textContent='自由调节船头'; $('#st').disabled=false; $('#vt').style.opacity=1;
    }
  });
  cv.addEventListener('pointermove',function(ev){
    var p=toLocal(ev), b=boats[0];
    if(!drag){
      var dx0=p.x-SX(b.x), dy0=p.y-SY(b.y);
      cv.style.cursor = Math.hypot(dx0,dy0)<95?'grab':'default';
      return;
    }
    var dx=p.x-SX(b.x), dy=p.y-SY(b.y);
    if(Math.hypot(dx,dy)<12) return;
    var wx=dx, wy=-dy;                       /* 屏幕 -> 世界方向 */
    var u=Math.hypot(wx,wy);
    var deg=Math.acos(clamp(-wx/u,-1,1))*180/Math.PI;   /* 与上游河岸(-x)的夹角 */
    P.theta=clamp(deg,3,177);
    syncThetaUI(); buildScene(); updateNotes();
  });
  cv.addEventListener('pointerup',function(){ drag=false; cv.style.cursor='default'; });
  cv.addEventListener('pointercancel',function(){ drag=false; });
}
function syncThetaUI(){
  $('#st').value=Math.round(P.theta);
  $('#vt').textContent=Math.round(P.theta);
}

/* ================= 启动 ================= */
function boot(){
  fit(); initStreaks(); bind();
  buildScene(); updateTheory(); updateNotes();
  resetSim();
  requestAnimationFrame(loop);
  window.addEventListener('resize',function(){ fit(); initStreaks(); });
}
boot();
})();
</script>
</body>
</html>
