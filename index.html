<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

<body>
  <div class="container">
    <div class="header">
      <h1>动态平衡 · 动画演示</h1>
      <div class="subtitle">高三一轮力学复习 · 物理小余老师</div>
    </div>

    <div class="grid">
      <!-- 面板 1: 球壳模型 -->
      <div class="panel">
        <div class="panel-title">球壳模型</div>
        <div class="canvas-wrap">
          <canvas id="cv1" width="800" height="600"></canvas>
        </div>
        <div class="formula-card">
          <div class="row"><span>平衡条件</span><span class="val">2T·cosθ = mg</span></div>
          <div class="row"><span>张力</span><span class="val">T = 7 N</span></div>
          <div class="row"><span>重力</span><span class="val">mg = 10 N</span></div>
          <div class="row"><span>对应角度</span><span class="val" id="theta1-val">θ = 42°</span></div>
        </div>
      </div>

      <!-- 面板 2: 矢量三角形法 -->
      <div class="panel">
        <div class="panel-title">矢量三角形法</div>
        <div class="panel-body">
          <div class="sub-grid">
            <div class="sub-panel">
              <div class="sub-panel-header">原始图力</div>
              <div class="canvas-wrap">
                <canvas id="cv2" width="600" height="500"></canvas>
              </div>
              <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span>T 张力</div>
                <div class="legend-item"><span class="legend-dot" style="background:#059669"></span>F 变力</div>
                <div class="legend-item"><span class="legend-dot" style="background:#1a3a8f"></span>G 重力</div>
              </div>
            </div>
            <div class="sub-panel">
              <div class="sub-panel-header">动态图解分析</div>
              <div class="canvas-wrap">
                <canvas id="cv3" width="600" height="500"></canvas>
              </div>
              <div class="legend">
                <div class="legend-item">F 恒定方向，T 端点沿直线滑动</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 面板 3: 辅助外接圆法 -->
      <div class="panel">
        <div class="panel-title">辅助外接圆法</div>
        <div class="panel-body">
          <div class="sub-grid">
            <div class="sub-panel">
              <div class="sub-panel-header">原始图力</div>
              <div class="canvas-wrap">
                <canvas id="cv4" width="600" height="500"></canvas>
              </div>
              <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#1a3a8f"></span>G 恒力</div>
                <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span>F₁ 变力</div>
                <div class="legend-item"><span class="legend-dot" style="background:#059669"></span>F₂ 变力</div>
              </div>
            </div>
            <div class="sub-panel">
              <div class="sub-panel-header">动态图解分析</div>
              <div class="canvas-wrap">
                <canvas id="cv5" width="600" height="500"></canvas>
              </div>
              <div class="legend">
                <div class="legend-item">外接圆 · 180°-θ · 恒力定值 G</div>

    <!-- 统一控制栏 -->
    <div class="control-bar">
      <div class="control-row">
        <div class="btn-group">
          <button class="btn btn-primary" id="playBtn">▶ 播放</button>

        <div class="slider-wrap">
          <label>角度 θ</label>
          <input type="range" id="angleSlider" min="0" max="120" step="0.5" value="42">
          <span class="angle-display" id="angleDisplay">42°</span>
        </div>
        <div class="btn-group">
          <button class="btn" data-speed="0.5">0.5×</button>
          <button class="btn active" data-speed="1">1.0×</button>
          <button class="btn" data-speed="2">2.0×</button>
        </div>
      </div>

<script>
"use strict";

const COLORS = {
  T:  '#dc2626',     // 红 - 张力
  F:  '#059669',     // 绿 - 变力
  G:  '#1a3a8f',     // 蓝 - 重力
  F1: '#dc2626',     // 红
  F2: '#059669',     // 绿
  F3: '#7c3aed',     // 紫
  text: '#1f2937',
  grid: '#e5e7eb',
  circle: '#9ca3af',
  fill: 'rgba(26, 58, 143, 0.08)',
  bg: '#ffffff'
};

let state = {
  theta: 42,                   // 角度（度）
  playing: false,
  speed: 1,
  animId: null,
  lastTime: 0,
  direction: 1                  // 0→120 来回
};

// ---------- 通用工具 ----------
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr * rect.width / cv.getAttribute('width'), dpr * rect.height / cv.getAttribute('height'));
  ctx.font = '14px "Microsoft YaHei", sans-serif';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  return ctx;
}

function drawArrow(ctx, x1, y1, x2, y2, color, lw = 2, label = '') {
  const head = 9;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 0.5) return;
  const ux = dx / len, uy = dy / len;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // 箭头
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * head + uy * head * 0.4, y2 - uy * head - ux * head * 0.4);
  ctx.lineTo(x2 - ux * head - uy * head * 0.4, y2 - uy * head + ux * head * 0.4);
  ctx.closePath();
  ctx.fill();
  // 标签
  if (label) {
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    const lx = x1 + dx * 0.5 + uy * 8;
    const ly = y1 + dy * 0.5 - ux * 8;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeText(label, lx, ly);
    ctx.fillStyle = color;
    ctx.fillText(label, lx, ly);
  }
}

function drawDot(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// =========================== 场景 1: 球壳模型 ===========================
function drawScene1(theta) {
  const cv = document.getElementById('cv1');
  const ctx = setupCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  // 坐标系
  const cx = W * 0.5;
  const topY = 60;
  const ballR = 16;
  const trunkH = 180;
  const ropeLen = 150;

  // 球壳模型容器
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(148, 163, 184, 0.06)';
  ctx.beginPath();
  ctx.moveTo(cx - 200, topY);
  ctx.lineTo(cx - 200, topY + trunkH);
  ctx.lineTo(cx + 200, topY + trunkH);
  ctx.lineTo(cx + 200, topY);
  ctx.stroke();
  // 头顶光圈
  ctx.beginPath();
  ctx.arc(cx, topY, 30, Math.PI, 0);
  ctx.strokeStyle = '#cbd5e1';
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // 球
  const ballY = topY + trunkH - 80;
  const ballX = cx;
  drawDot(ctx, ballX, ballY, ballR, COLORS.G);

  // 角度 θ（从垂直方向两侧张开）
  const angRad = theta * Math.PI / 180;
  const cos = Math.cos(angRad), sin = Math.sin(angRad);

  // 绳
  const L1x = ballX + ropeLen * sin;
  const L1y = ballY - ropeLen * cos;
  const L2x = ballX - ropeLen * sin;
  const L2y = ballY - ropeLen * cos;

  // 绳
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(L1x, L1y);
  ctx.lineTo(ballX, ballY);
  ctx.lineTo(L2x, L2y);
  ctx.stroke();

  // 顶部固定点
  drawDot(ctx, L1x, L1y, 4, '#475569');
  drawDot(ctx, L2x, L2y, 4, '#475569');

  // 角度弧
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(ballX, ballY, 35, -Math.PI / 2 - angRad, -Math.PI / 2 + angRad);
  ctx.stroke();
  ctx.fillStyle = '#64748b';
  ctx.font = '13px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('θ', ballX, ballY - 38);
  ctx.textAlign = 'left';

  // 张力 T 箭头（沿绳向上）
  drawArrow(ctx, ballX, ballY, L1x, L1y, COLORS.T, 2.5, 'T');
  drawArrow(ctx, ballX, ballY, L2x, L2y, COLORS.T, 2.5, 'T');

  // 重力 mg
  drawArrow(ctx, ballX, ballY + ballR, ballX, ballY + ballR + 60, COLORS.G, 3, 'mg');

  // 顶部公式标注
  ctx.fillStyle = '#1a3a8f';
  ctx.font = 'bold 14px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText('2T·cosθ = mg', 30, 30);

  // 实时数值
  if (theta > 0 && theta < 90) {
    const T = 10 / (2 * cos);
    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 13px "Courier New"';
    ctx.fillText(`T = ${T.toFixed(2)} N`, 30, 55);
  }
  ctx.fillStyle = '#1a3a8f';
  ctx.font = '13px "Courier New"';
  ctx.fillText(`θ = ${theta.toFixed(1)}°`, 30, 75);
}

// =========================== 场景 2: 矢量三角形法（原始图力） ===========================
function drawScene2(theta) {
  const cv = document.getElementById('cv2');
  const ctx = setupCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const cx = W * 0.5, cy = H * 0.55;
  const angRad = theta * Math.PI / 180;

  // 重力 G 大小固定，向下
  const G = 100;
  const T = 100; // 绳长，统一
  // F 长度随 θ 变化，由三角形闭合决定

  // 几何：绳方向与水平成 θ，向下指向；T 沿绳反方向
  // T 的方向：向左上方，从端点出发
  const Tx = -Math.cos(angRad);
  const Ty = -Math.sin(angRad);
  const T2x = Math.cos(angRad);
  const T2y = -Math.sin(angRad);
  // 力的端点：T 端点 = 沿 T 方向
  const T_end1 = { x: cx + Tx * T, y: cy + Ty * T };
  const T_end2 = { x: cx + T2x * T, y: cy + T2y * T };
  // F 端点：从端点指向中心
  const F1_end = { x: cx, y: cy };
  const F2_start = { x: cx, y: cy };

  // 中心点
  drawDot(ctx, cx, cy, 8, '#1f2937');

  // T 力
  drawArrow(ctx, cx, cy, T_end1.x, T_end1.y, COLORS.T, 2.5, 'T');
  drawArrow(ctx, cx, cy, T_end2.x, T_end2.y, COLORS.T, 2.5, 'T');

  // G（重力）固定向下
  drawArrow(ctx, cx, cy, cx, cy + G, COLORS.G, 3, 'G');

  // F：变化的方向与大小，从 T 端点指向球
  // 通过三角形闭环：G + F + T = 0
  // 固定 T,G 方向不变；当 F 方向变化时（如角度），其大小由 T 和 G 决定
  // 这里让 F 始终沿固定方向（45°斜向上），大小由几何决定
  const F_fixed_angle = -Math.PI / 4; // 45° 斜向上
  // F = - (T + G) 分解到 F 方向
  const Fx = T * Tx + T2x * T + 0; // T 合力
  const Fy = T * Ty + T2y * T + G;
  // F 的大小
  const F_mag = Math.abs(Fx * Math.cos(F_fixed_angle) + Fy * Math.sin(F_fixed_angle));
  const Fx2 = F_fixed_angle === 0 ? 0 : Math.cos(F_fixed_angle);
  const Fy2 = Math.sin(F_fixed_angle);
  const F_end = { x: cx + Fx2 * F_mag, y: cy + Fy2 * F_mag };

  drawArrow(ctx, cx, cy, F_end.x, F_end.y, COLORS.F, 2.5, 'F');

  // 角度标注
  ctx.strokeStyle = COLORS.G;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx, cy + 50);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#1f2937';
  ctx.font = '13px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText(`θ = ${theta.toFixed(1)}°`, cx + 10, cy + 70);
  ctx.textAlign = 'right';
  ctx.fillText(`F = ${F_mag.toFixed(1)} N`, W - 10, 30);
  ctx.textAlign = 'left';
}

// =========================== 场景 3: 矢量三角形法（动态图解） ===========================
function drawScene3(theta) {
  const cv = document.getElementById('cv3');
  const ctx = setupCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const cx = W * 0.4, cy = H * 0.5;
  const scale = 1.5;
  const G = 80 * scale; // 重力大小

  // 几何：T = 端点 A，逆时针旋转 θ
  // G 固定向下
  // F 连接 A 到 B（终点）
  const angRad = theta * Math.PI / 180;

  // 三个顶点：起点 O，T 端点 A，F 端点 B
  const O = { x: cx, y: cy + G / 2 };
  // T 方向：固定方向（斜向上）
  const T_angle = -Math.PI / 2 - angRad; // 垂直方向起顺时针
  const T_mag = 80 * scale;
  const A = {
    x: O.x + T_mag * Math.cos(T_angle),
    y: O.y + T_mag * Math.sin(T_angle)
  };
  // F 方向：固定
  const F_angle = 0;
  const F_mag = 90 * scale;
  const B = {
    x: O.x + F_mag * Math.cos(F_angle),
    y: O.y + F_mag * Math.sin(F_angle)
  };
  // 实际封闭需 F 末点 = T 末点 -> 调整 F
  // 简化：直接画三条边
  const G_vec = { x: 0, y: G };
  const T_vec = { x: A.x - O.x, y: A.y - O.y };
  const F_vec = { x: B.x - A.x, y: B.y - A.y };

  // 三角形
  ctx.strokeStyle = '#1a3a8f';
  ctx.fillStyle = 'rgba(26, 58, 143, 0.05)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(O.x, O.y);
  ctx.lineTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 顶点
  ['O', 'A', 'B'].forEach((n, i) => {
    const p = [O, A, B][i];
    drawDot(ctx, p.x, p.y, 6, '#1a3a8f');
    ctx.fillStyle = '#1a3a8f';
    ctx.font = 'bold 13px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(n, p.x, p.y - 14);
  });

  // 箭头
  drawArrow(ctx, O.x, O.y, A.x, A.y, COLORS.T, 2.5, 'T');
  drawArrow(ctx, A.x, A.y, B.x, B.y, COLORS.F, 2.5, 'F');
  drawArrow(ctx, O.x, O.y, O.x, O.y + G, COLORS.G, 3, 'G');

  // 右下角显示
  ctx.textAlign = 'left';
  ctx.fillStyle = '#1f2937';
  ctx.font = '13px "Courier New"';
  ctx.fillText(`T 端点 A 沿直线滑动`, W - 180, H - 30);
  ctx.fillText(`F 方向恒定`, W - 180, H - 12);
}

// =========================== 场景 4: 辅助外接圆法（原始图力） ===========================
function drawScene4(theta) {
  const cv = document.getElementById('cv4');
  const ctx = setupCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const cx = W * 0.5, cy = H * 0.55;
  const angRad = theta * Math.PI / 180;

  // 球
  const ballR = 14;
  drawDot(ctx, cx, cy, ballR, '#1f2937');

  // G 向下
  const G = 90;
  drawArrow(ctx, cx, cy, cx, cy + G, COLORS.G, 3, 'G');

  // F1 斜向左下
  const F1_angle = Math.PI + angRad;
  const F1_len = 110;
  const F1_end = {
    x: cx + F1_len * Math.cos(F1_angle),
    y: cy + F1_len * Math.sin(F1_angle)
  };
  drawArrow(ctx, cx, cy, F1_end.x, F1_end.y, COLORS.F1, 2.5, 'F₁');

  // F2 斜向右上
  const F2_angle = -angRad;
  const F2_len = 110;
  const F2_end = {
    x: cx + F2_len * Math.cos(F2_angle),
    y: cy + F2_len * Math.sin(F2_angle)
  };
  drawArrow(ctx, cx, cy, F2_end.x, F2_end.y, COLORS.F2, 2.5, 'F₂');

  // 角度弧
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, 28, Math.PI, Math.PI + angRad);
  ctx.stroke();
  ctx.fillStyle = '#64748b';
  ctx.font = '13px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('θ', cx - 38, cy + 5);
  ctx.textAlign = 'left';

  // 数值
  ctx.fillStyle = '#1f2937';
  ctx.font = '13px "Courier New"';
  ctx.fillText(`θ = ${theta.toFixed(1)}°`, 20, 25);
}

// =========================== 场景 5: 辅助外接圆法（动态图解） ===========================
function drawScene5(theta) {
  const cv = document.getElementById('cv5');
  const ctx = setupCanvas(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  const cx = W * 0.5, cy = H * 0.55;
  const scale = 1.5;
  const angRad = theta * Math.PI / 180;

  // F₁ 起点 O -> 端点 A
  const F1_mag = 95 * scale;
  const F1_angle = Math.PI;
  const O = { x: cx, y: cy };
  const A = { x: O.x + F1_mag * Math.cos(F1_angle), y: O.y + F1_mag * Math.sin(F1_angle) };

  // F₂ 起点 A -> 端点 B
  // F₂ 的方向：与 F₁ 夹角为 (180° - θ)
  const F2_angle = Math.PI + (Math.PI - angRad);
  const F2_mag = 100 * scale;
  const B = { x: A.x + F2_mag * Math.cos(F2_angle), y: A.y + F2_mag * Math.sin(F2_angle) };

  // G：连接 B -> O
  const G1 = O, G2 = B;

  // 外接圆：三角形 OAB 的外接圆
  // 圆心是三边的中垂线交点
  function circumcenter(p1, p2, p3) {
    const ax = p1.x, ay = p1.y;
    const bx = p2.x, by = p2.y;
    const cx = p3.x, cy = p3.y;
    const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    if (Math.abs(d) < 1e-6) return null;
    const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
    const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;
    return { x: ux, y: uy };
  }
  const center = circumcenter(O, A, B);
  const radius = center ? Math.hypot(O.x - center.x, O.y - center.y) : 100;

  // 外接圆
  if (center) {
    ctx.strokeStyle = '#9ca3af';
    ctx.fillStyle = 'rgba(124, 58, 237, 0.04)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    // 圆心
    drawDot(ctx, center.x, center.y, 4, '#7c3aed');
    ctx.fillStyle = '#7c3aed';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('外接圆', center.x, center.y - 10);
  }

  // 三角形
  ctx.strokeStyle = '#1a3a8f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(O.x, O.y);
  ctx.lineTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.closePath();
  ctx.stroke();

  // 顶点
  ['O', 'A', 'B'].forEach((n, i) => {
    const p = [O, A, B][i];
    drawDot(ctx, p.x, p.y, 6, '#1a3a8f');
    ctx.fillStyle = '#1a3a8f';
    ctx.font = 'bold 13px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(n, p.x, p.y - 14);
  });

  // 箭头
  drawArrow(ctx, O.x, O.y, A.x, A.y, COLORS.F1, 2.5, 'F₁');
  drawArrow(ctx, A.x, A.y, B.x, B.y, COLORS.F2, 2.5, 'F₂');
  drawArrow(ctx, B.x, B.y, O.x, O.y, COLORS.G, 3, 'G');

  // 角度标注：A 处 180°-θ
  if (theta > 1 && theta < 179) {
    const va = { x: A.x - O.x, y: A.y - O.y };
    const vb = { x: B.x - A.x, y: B.y - A.y };
    const a1 = Math.atan2(va.y, va.x);
    const a2 = Math.atan2(vb.y, vb.x);
    let dAng = a2 - a1;
    while (dAng > Math.PI) dAng -= 2 * Math.PI;
    while (dAng < -Math.PI) dAng += 2 * Math.PI;
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(A.x, A.y, 24, a1, a1 + dAng);
    ctx.stroke();
    ctx.fillStyle = '#dc2626';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.fillText(`180°-θ`, A.x + 30, A.y + 5);
  }

  // 标签
  ctx.fillStyle = '#1f2937';
  ctx.font = '13px "Microsoft YaHei"';
  ctx.textAlign = 'right';
  ctx.fillText('恒力定值 G', W - 10, 25);
  ctx.textAlign = 'left';
  ctx.fillText(`θ = ${theta.toFixed(1)}°`, 20, 25);
}

// =========================== 渲染与动画 ===========================
function renderAll() {
  drawScene1(state.theta);
  drawScene2(state.theta);
  drawScene3(state.theta);
  drawScene4(state.theta);
  drawScene5(state.theta);
  document.getElementById('theta1-val').textContent = `θ = ${state.theta.toFixed(1)}°`;
}

function tick(now) {
  if (!state.lastTime) state.lastTime = now;
  const dt = (now - state.lastTime) / 1000;
  state.lastTime = now;
  if (state.playing) {
    const dTheta = dt * 20 * state.speed * state.direction;
    state.theta += dTheta;
    if (state.theta >= 120) {
      state.theta = 120;
      state.direction = -1;
    } else if (state.theta <= 0) {
      state.theta = 0;
      state.direction = 1;
    }
    document.getElementById('angleSlider').value = state.theta;
    document.getElementById('angleDisplay').textContent = state.theta.toFixed(1) + '°';
    const pct = (state.theta / 120) * 100;
    document.getElementById('angleSlider').style.setProperty('--p', pct + '%');
    renderAll();
  }
  state.animId = requestAnimationFrame(tick);
}

// =========================== 事件 ===========================
function init() {
  renderAll();
  const slider = document.getElementById('angleSlider');
  const display = document.getElementById('angleDisplay');
  slider.addEventListener('input', e => {
    state.theta = parseFloat(e.target.value);
    display.textContent = state.theta.toFixed(1) + '°';
    const pct = (state.theta / 120) * 100;
    slider.style.setProperty('--p', pct + '%');
    renderAll();
  });

  document.getElementById('playBtn').addEventListener('click', () => {
    state.playing = !state.playing;
    document.getElementById('playBtn').textContent = state.playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    state.theta = 42;
    state.playing = false;
    state.direction = 1;
    slider.value = 42;
    display.textContent = '42°';
    slider.style.setProperty('--p', (42 / 120) * 100 + '%');
    document.getElementById('playBtn').textContent = '▶ 播放';
    renderAll();
  });

  document.querySelectorAll('[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.speed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  window.addEventListener('resize', renderAll);
  state.animId = requestAnimationFrame(tick);
}

window.addEventListener('load', init);
</script>
